<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>闲鱼图片搜索</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 16px; }
    input, button { padding: 8px; margin-right: 8px; }
    pre { background: #f6f8fa; padding: 12px; overflow: auto; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>闲鱼图片搜索</h1>
  <p>上传本地图片后，调用 agent 在闲鱼网页执行以图搜并返回商品价格结果。</p>

  <div class="card">
    <input id="image" type="file" accept="image/*" />
    <input id="maxItems" type="number" value="20" min="1" max="100" />
    <button id="submit">开始搜索</button>
  </div>

  <div class="card">
    <h3>返回结果</h3>
    <pre id="result">尚未搜索</pre>
  </div>

  <script>
    const btn = document.getElementById('submit');
    const output = document.getElementById('result');

    btn.onclick = async () => {
      const imageInput = document.getElementById('image');
      if (!imageInput.files.length) {
        output.textContent = '请先选择图片';
        return;
      }

      const formData = new FormData();
      formData.append('image', imageInput.files[0]);
      formData.append('max_items', document.getElementById('maxItems').value || '20');

      output.textContent = '搜索中，请稍候...';
      try {
        const resp = await fetch('/api/search-by-image', { method: 'POST', body: formData });
        const data = await resp.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = '请求失败: ' + err;
      }
    };
  </script>
</body>
</html>
