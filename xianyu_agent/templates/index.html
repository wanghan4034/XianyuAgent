<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>闲鱼搜索工作台</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }
    .container { max-width: 1080px; margin: 24px auto; padding: 0 16px; }
    .hero {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 12px 30px rgba(99, 102, 241, .25);
    }
    .hero h1 { margin: 0 0 8px; font-size: 28px; }
    .hero p { margin: 0; opacity: .95; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, .04);
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab {
      border: 1px solid #d1d5db;
      background: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
    }
    .tab.active { background: #2563eb; border-color: #2563eb; color: #fff; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .row label { width: 88px; color: #4b5563; font-size: 14px; }
    input[type="number"], input[type="text"], input[type="file"] {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
    }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    button {
      border: none;
      background: #2563eb;
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary { background: #0f766e; }
    button.ghost { background: #e5e7eb; color: #111827; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .dropzone {
      border: 2px dashed #93c5fd;
      border-radius: 12px;
      background: #eff6ff;
      padding: 14px;
      text-align: center;
      color: #1d4ed8;
      margin-bottom: 8px;
    }
    .preview { display: none; margin-top: 8px; max-width: 100%; border-radius: 10px; border: 1px solid #e5e7eb; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-bottom: 10px; }
    .metric { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px; }
    .metric .k { color: #6b7280; font-size: 12px; }
    .metric .v { font-weight: 700; margin-top: 4px; }
    pre {
      margin: 0;
      background: #0b1021;
      color: #cbd5e1;
      border-radius: 10px;
      padding: 12px;
      min-height: 260px;
      overflow: auto;
      font-size: 12px;
    }
    .muted { color: #6b7280; font-size: 13px; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .summary { grid-template-columns: repeat(2, minmax(0,1fr)); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>闲鱼搜索工作台</h1>
      <p>支持关键词搜索、图片搜索、网页以图搜能力探测，并提供价格统计与 JSON 结果导出。</p>
    </div>

    <div class="grid">
      <div class="card">
        <div class="tabs">
          <button class="tab active" data-mode="image">图片搜索</button>
          <button class="tab" data-mode="keyword">关键词搜索</button>
        </div>

        <div id="imagePanel">
          <div class="dropzone" id="dropzone">拖拽图片到此处，或点击下方选择文件</div>
          <input id="image" type="file" accept="image/*" />
          <img id="preview" class="preview" alt="图片预览" />
        </div>

        <div id="keywordPanel" style="display:none;">
          <div class="row">
            <label for="keyword">关键词</label>
            <input id="keyword" type="text" placeholder="例如：iPhone 15" />
          </div>
        </div>

        <div class="row">
          <label for="maxItems">抓取数量</label>
          <input id="maxItems" type="number" value="20" min="1" max="100" />
        </div>

        <div class="actions">
          <button id="submit">开始搜索</button>
          <button class="secondary" id="probe">检测网页以图搜能力</button>
          <button class="ghost" id="download">下载结果 JSON</button>
        </div>

        <p class="muted" id="status">就绪。</p>
      </div>

      <div class="card">
        <div class="summary">
          <div class="metric"><div class="k">样本数</div><div class="v" id="mCount">-</div></div>
          <div class="metric"><div class="k">最低价</div><div class="v" id="mMin">-</div></div>
          <div class="metric"><div class="k">中位价</div><div class="v" id="mMedian">-</div></div>
          <div class="metric"><div class="k">最高价</div><div class="v" id="mMax">-</div></div>
        </div>
        <pre id="result">尚未搜索</pre>
      </div>
    </div>
  </div>

  <script>
    const tabs = [...document.querySelectorAll('.tab')];
    const imagePanel = document.getElementById('imagePanel');
    const keywordPanel = document.getElementById('keywordPanel');
    const imageInput = document.getElementById('image');
    const keywordInput = document.getElementById('keyword');
    const maxItemsInput = document.getElementById('maxItems');
    const submitBtn = document.getElementById('submit');
    const probeBtn = document.getElementById('probe');
    const downloadBtn = document.getElementById('download');
    const dropzone = document.getElementById('dropzone');
    const preview = document.getElementById('preview');
    const output = document.getElementById('result');
    const status = document.getElementById('status');
    const metrics = {
      count: document.getElementById('mCount'),
      min: document.getElementById('mMin'),
      median: document.getElementById('mMedian'),
      max: document.getElementById('mMax'),
    };

    let mode = 'image';
    let latestResult = null;

    const setStatus = (text) => status.textContent = text;
    const setLoading = (loading) => {
      submitBtn.disabled = loading;
      probeBtn.disabled = loading;
      setStatus(loading ? '处理中，请稍候...' : '就绪。');
    };

    const fillSummary = (summary = {}) => {
      metrics.count.textContent = summary.count ?? '-';
      metrics.min.textContent = summary.min_price ?? '-';
      metrics.median.textContent = summary.median_price ?? '-';
      metrics.max.textContent = summary.max_price ?? '-';
    };

    const renderResult = (data) => {
      latestResult = data;
      output.textContent = JSON.stringify(data, null, 2);
      fillSummary(data.summary || {});
    };

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        tabs.forEach((x) => x.classList.remove('active'));
        tab.classList.add('active');
        mode = tab.dataset.mode;
        imagePanel.style.display = mode === 'image' ? 'block' : 'none';
        keywordPanel.style.display = mode === 'keyword' ? 'block' : 'none';
      });
    });

    imageInput.addEventListener('change', () => {
      const file = imageInput.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        preview.src = reader.result;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.style.background = '#dbeafe';
    });
    dropzone.addEventListener('dragleave', () => {
      dropzone.style.background = '#eff6ff';
    });
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.style.background = '#eff6ff';
      if (!e.dataTransfer.files?.length) return;
      imageInput.files = e.dataTransfer.files;
      imageInput.dispatchEvent(new Event('change'));
    });

    submitBtn.onclick = async () => {
      setLoading(true);
      try {
        if (mode === 'image') {
          if (!imageInput.files.length) {
            renderResult({ error: '请先选择图片' });
            return;
          }
          const formData = new FormData();
          formData.append('image', imageInput.files[0]);
          formData.append('max_items', maxItemsInput.value || '20');
          const resp = await fetch('/api/search-by-image', { method: 'POST', body: formData });
          renderResult(await resp.json());
        } else {
          const keyword = keywordInput.value.trim();
          if (!keyword) {
            renderResult({ error: '请输入关键词' });
            return;
          }
          const resp = await fetch('/api/search-by-keyword', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ keyword, max_items: maxItemsInput.value || '20' }),
          });
          renderResult(await resp.json());
        }
      } catch (err) {
        renderResult({ error: '请求失败: ' + err });
      } finally {
        setLoading(false);
      }
    };

    probeBtn.onclick = async () => {
      setLoading(true);
      try {
        const resp = await fetch('/api/capability');
        renderResult(await resp.json());
      } catch (err) {
        renderResult({ error: '能力探测失败: ' + err });
      } finally {
        setLoading(false);
      }
    };

    downloadBtn.onclick = () => {
      if (!latestResult) {
        setStatus('暂无结果可下载。');
        return;
      }
      const blob = new Blob([JSON.stringify(latestResult, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `xianyu-result-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      setStatus('已下载结果 JSON。');
    };
  </script>
</body>
</html>
