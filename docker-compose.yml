services:
  xianyu-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: xianyu-agent:latest
    environment:
      KEYWORD: ${KEYWORD:-iPhone 15}
      MAX_ITEMS: ${MAX_ITEMS:-10}
    command: ["sh", "-c", "python -m xianyu_agent.cli \"$${KEYWORD}\" --max-items $${MAX_ITEMS}"]

  xianyu-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: xianyu-agent:latest
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
    command: ["python", "-m", "xianyu_agent.web"]
